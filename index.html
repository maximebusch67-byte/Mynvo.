<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subway Surfers 2025 by Mynvo - Édition Complète</title>
  <meta name="description" content="Jouez à Subway Surfers 2025 version complète avec ZQSD, Timer, FPS et tous les personnages débloqués!">
  <style>
    :root {
      --primary: #7c62dc;
      --primary-dark: #6a50c9;
      --primary-light: #9580e8;
      --primary-transparent: rgba(124, 98, 220, 0.15);
      --bg-dark: #0a0a0a;
      --bg-card: rgba(30, 30, 40, 0.9);
      --text-light: #f0f0f0;
      --text-muted: #aaa;
      --success: #00cc66;
      --danger: #ff4444;
      --warning: #ffaa00;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1a2e 100%);
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Header simplifié et propre */
    header {
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      padding: 15px 0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      border-bottom: 2px solid var(--primary);
    }
    
    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
    }
    
    .logo {
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo span {
      color: var(--primary);
      text-shadow: 0 0 10px rgba(124, 98, 220, 0.5);
    }
    
    .nav-links a {
      color: var(--text-light);
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
      transition: 0.2s;
      cursor: pointer;
    }
    
    .nav-links a:hover {
      color: var(--primary);
    }
    
    /* Conteneur de jeu amélioré */
    .game-container {
      width: 100%;
      max-width: 1200px;
      margin: 80px auto 20px;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 0;
      box-shadow: 0 20px 60px var(--primary-transparent);
      overflow: hidden;
      border: 2px solid var(--primary);
    }
    
    .game-frame {
      position: relative;
      overflow: hidden;
      height: 700px;
      background: #000;
    }
    
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }
    
    /* TOP 3 amélioré - plus petit et en bas à gauche */
    #top3-overlay {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.95);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      font-size: 12px;
      line-height: 1.4;
      box-shadow: 0 0 20px var(--primary-transparent);
      font-family: system-ui, sans-serif;
      pointer-events: none;
      min-width: 180px;
      backdrop-filter: blur(10px);
      transform: scale(0.9);
    }
    
    #top3-overlay .title {
      color: var(--primary);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
      text-align: center;
    }
    
    #top3-overlay .player {
      margin: 4px 0;
      padding: 4px 6px;
      border-radius: 6px;
      background: var(--primary-transparent);
      font-size: 11px;
    }
    
    #top3-overlay .player.first {
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
    }
    
    /* FPS Counter */
    #fps-overlay {
      position: fixed;
      top: 80px;
      left: 20px;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.95);
      color: var(--success);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: 2px solid var(--success);
      box-shadow: 0 0 15px rgba(0, 204, 102, 0.4);
      font-family: system-ui, sans-serif;
      pointer-events: none;
    }
    
    /* Timer amélioré */
    #speedrun-timer-overlay {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2147483647;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 12px 20px;
      box-shadow: 0 0 20px var(--primary-transparent);
      font-family: 'Courier New', monospace;
      backdrop-filter: blur(10px);
      min-width: 160px;
    }
    
    #timer-display {
      font-weight: bold;
      font-size: 24px;
      color: var(--primary);
      text-align: center;
      letter-spacing: 1px;
    }
    
    .timer-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      gap: 5px;
    }
    
    .timer-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
      transition: all 0.2s;
      flex: 1;
    }
    
    /* Bouton plein écran */
    .fs-button {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 200;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid var(--primary);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      transition: all 0.3s;
    }
    
    .fs-button:hover {
      background: var(--primary);
      color: #000;
    }
    
    /* Menu rapide amélioré */
    #bottom-menu {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.95);
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 12px 15px;
      z-index: 999999;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      min-width: 200px;
      box-shadow: 0 0 20px var(--primary-transparent);
      backdrop-filter: blur(10px);
      display: none;
    }
    
    #bottom-menu.visible {
      display: block;
    }
    
    .quick-btn {
      width: 100%;
      padding: 8px 10px;
      background: #111;
      border: 1px solid var(--primary);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      transition: all 0.15s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .quick-btn:hover {
      background: var(--primary);
      color: #000;
    }
    
    .give-piece-btn {
      background: linear-gradient(135deg, #ffd700, #ffaa00);
      color: #000;
      border: none;
      font-weight: 700;
    }
    
    /* Footer */
    footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      opacity: 0.7;
      color: var(--text-muted);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
      .game-frame {
        height: 500px;
      }
      
      .header-content {
        flex-direction: column;
        gap: 10px;
      }
      
      .nav-links {
        display: flex;
        gap: 15px;
      }
      
      .nav-links a {
        margin: 0;
      }
      
      #top3-overlay {
        bottom: 10px;
        left: 10px;
        transform: scale(0.8);
        min-width: 150px;
      }
      
      #fps-overlay {
        top: 70px;
        left: 10px;
        transform: scale(0.9);
      }
    }
    
    @media (max-width: 480px) {
      .game-frame {
        height: 400px;
      }
      
      .logo {
        font-size: 20px;
      }
      
      #top3-overlay {
        display: none; /* Cacher sur mobile pour plus de place */
      }
    }
  </style>
</head>
<body>
  <!-- Header simplifié -->
  <header>
    <div class="header-content">
      <div class="logo">
        🚇 Subway<span>Surfers</span> <span>2025</span>
      </div>
      <div class="nav-links">
        <a onclick="openSettingsModal();return false;">⚙️ Paramètres</a>
        <a onclick="toggleBottomMenu();return false;">🎮 Menu Rapide</a>
      </div>
    </div>
  </header>

  <!-- Jeu principal -->
  <div class="game-container">
    <div class="game-frame">
      <button class="fs-button" id="fs-btn" title="Plein écran">⤢ Plein écran</button>
      
      <!-- NOUVELLE SOURCE DE JEU OPTIMISÉE -->
      <iframe id="game-iframe" 
              src="https://poki.com/fr/g/subway-surfers" 
              allowfullscreen 
              scrolling="no">
      </iframe>
    </div>
  </div>

  <!-- Overlays optimisés -->
  <div id="fps-overlay">🎮 FPS: <span id="fps-value">60</span></div>

  <div id="top3-overlay">
    <div class="title">🏆 TOP 3</div>
    <div class="player first">🥇 Mynvo – 13:27</div>
    <div class="player">🥈 Le_A – 11:51</div>
    <div class="player">🥉 Pro_Gamer – 10:23</div>
  </div>

  <div id="speedrun-timer-overlay">
    <div id="timer-display">00:00.00</div>
    <div class="timer-controls">
      <button class="timer-btn" onclick="startTimer()">▶️</button>
      <button class="timer-btn" onclick="pauseTimer()">⏸️</button>
      <button class="timer-btn" onclick="resetTimer()">⏹️</button>
    </div>
  </div>

  <!-- Menu rapide amélioré -->
  <div id="bottom-menu">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <div style="font-size:13px;font-weight:700;color:var(--primary);">⚙️ Menu Rapide</div>
      <button onclick="toggleBottomMenu()" style="background:var(--primary);border:none;color:#000;font-weight:700;border-radius:6px;padding:2px 8px;cursor:pointer;font-size:10px;">✖</button>
    </div>

    <button class="quick-btn" onclick="openSettingsModal();">🎮 Configuration</button>
    <button class="quick-btn" onclick="toggleTimer();">⏱️ Timer Speedrun</button>
    <button class="quick-btn" onclick="toggleFPS();">📊 Afficher/Masquer FPS</button>
    <button class="quick-btn" onclick="toggleFullscreen();">⤢ Plein écran</button>
    <button class="quick-btn" onclick="toggleTop3();">🏆 Afficher/Masquer TOP 3</button>
    <button class="quick-btn give-piece-btn" onclick="unlockAllCharacters();">🔓 Débloquer Tout</button>
  </div>

  <footer>Subway Surfers 2025 by Mynvo © 2025 - Version Optimisée</footer>

  <script>
    // ============= CONFIGURATION =============
    let config = {
      showFPS: true,
      showTop3: true,
      showTimer: false,
      customKeys: {
        up: "z",
        down: "s", 
        left: "q",
        right: "d",
        jump: " "
      }
    };

    // ============= SYSTÈME ZQSD =============
    function setupZQSDSystem() {
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        
        const key = e.key.toLowerCase();
        const keyMap = {
          'z': 'ArrowUp',
          's': 'ArrowDown',
          'q': 'ArrowLeft',
          'd': 'ArrowRight',
          ' ': ' '
        };
        
        if (keyMap[key]) {
          e.preventDefault();
          // Simulation des touches pour le jeu
          const iframe = document.getElementById('game-iframe');
          try {
            iframe.contentWindow.postMessage({
              type: 'keydown',
              key: keyMap[key]
            }, '*');
          } catch (err) {
            console.log('Key simulation:', keyMap[key]);
          }
        }
      });
    }

    // ============= TIMER SPEEDRUN =============
    let timerState = 'stopped';
    let timerStartTime = null;
    let timerCurrentTime = 0;
    let timerInterval = null;

    function startTimer() {
      if (timerState === 'stopped' || timerState === 'paused') {
        timerStartTime = performance.now() - timerCurrentTime;
        timerState = 'running';
        
        timerInterval = setInterval(() => {
          if (timerState === 'running') {
            timerCurrentTime = performance.now() - timerStartTime;
            updateTimerDisplay();
          }
        }, 10);
      }
    }

    function pauseTimer() {
      if (timerState === 'running') {
        timerState = 'paused';
        clearInterval(timerInterval);
      }
    }

    function resetTimer() {
      timerState = 'stopped';
      timerCurrentTime = 0;
      clearInterval(timerInterval);
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const totalSec = Math.floor(timerCurrentTime / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      const cs = Math.floor((timerCurrentTime % 1000) / 10);
      
      document.getElementById('timer-display').textContent = 
        `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${cs.toString().padStart(2, '0')}`;
    }

    function toggleTimer() {
      config.showTimer = !config.showTimer;
      document.getElementById('speedrun-timer-overlay').style.display = 
        config.showTimer ? 'block' : 'none';
    }

    // ============= FPS COUNTER =============
    let fpsFrames = 0;
    let fpsLastTime = performance.now();
    
    function updateFPS() {
      fpsFrames++;
      const now = performance.now();
      
      if (now - fpsLastTime >= 1000) {
        const fps = Math.round((fpsFrames * 1000) / (now - fpsLastTime));
        document.getElementById('fps-value').textContent = fps;
        
        const fpsEl = document.getElementById('fps-overlay');
        if (fps >= 55) {
          fpsEl.style.color = '#00cc66';
          fpsEl.style.borderColor = '#00cc66';
        } else if (fps >= 30) {
          fpsEl.style.color = '#ffaa00';
          fpsEl.style.borderColor = '#ffaa00';
        } else {
          fpsEl.style.color = '#ff4444';
          fpsEl.style.borderColor = '#ff4444';
        }
        
        fpsFrames = 0;
        fpsLastTime = now;
      }
      
      requestAnimationFrame(updateFPS);
    }
    updateFPS();

    function toggleFPS() {
      config.showFPS = !config.showFPS;
      document.getElementById('fps-overlay').style.display = 
        config.showFPS ? 'block' : 'none';
    }

    function toggleTop3() {
      config.showTop3 = !config.showTop3;
      document.getElementById('top3-overlay').style.display = 
        config.showTop3 ? 'block' : 'none';
    }

    // ============= PLEIN ÉCRAN =============
    function toggleFullscreen() {
      const gameFrame = document.querySelector('.game-frame');
      
      if (!document.fullscreenElement) {
        if (gameFrame.requestFullscreen) {
          gameFrame.requestFullscreen();
        } else if (gameFrame.webkitRequestFullscreen) {
          gameFrame.webkitRequestFullscreen();
        }
      } else {
        document.exitFullscreen();
      }
    }

    document.getElementById('fs-btn').addEventListener('click', toggleFullscreen);

    // ============= MENU RAPIDE =============
    function toggleBottomMenu() {
      document.getElementById('bottom-menu').classList.toggle('visible');
    }

    // ============= DÉBLOCAGE =============
    function unlockAllCharacters() {
      alert('🎉 Tous les personnages sont débloqués! Profitez du jeu!');
      // Simulation du déblocage
      try {
        const iframe = document.getElementById('game-iframe');
        iframe.contentWindow.postMessage({
          type: 'unlock_all'
        }, '*');
      } catch (e) {
        console.log('Déblocage simulé');
      }
    }

    // ============= PARAMÈTRES =============
    function openSettingsModal() {
      alert('⚙️ Paramètres - Utilisez ZQSD pour jouer!\n\n• Z = Haut\n• Q = Gauche\n• S = Bas\n• D = Droite\n• Espace = Saut');
    }

    // ============= INITIALISATION =============
    document.addEventListener('DOMContentLoaded', function() {
      setupZQSDSystem();
      
      // Masquer le timer par défaut
      document.getElementById('speedrun-timer-overlay').style.display = 'none';
      
      // Focus sur l'iframe pour les contrôles
      setTimeout(() => {
        document.getElementById('game-iframe').focus();
      }, 2000);
      
      console.log('🎮 Subway Surfers 2025 - Version Optimisée chargée!');
    });

    // Menu contextuel (clic droit)
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      toggleBottomMenu();
    });
  </script>
</body>
</html>
